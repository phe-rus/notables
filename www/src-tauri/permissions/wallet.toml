[[permission]]
identifier = "wallet-access"
description = "Allows the local main window to access the encrypted wallet. Native commands also verify its origin, route and session."
commands.allow = [
  "wallet_migrate_prototype", "wallet_status", "wallet_initialize", "wallet_unlock", "wallet_lock",
  "wallet_development_unlock",
  "wallet_configure", "wallet_authorize", "wallet_reveal_field", "wallet_list", "wallet_read", "wallet_save", "wallet_delete", "wallet_activity"
]
