[[permission]]
identifier = "existing-app-commands"
description = "Preserves existing app command permissions while wallet access is restricted separately."
commands.allow = [
  "export_save_file",
  "export_print",
  "open_microphone_settings",
  "storage_document_load",
  "storage_document_append",
  "storage_document_replace",
  "storage_document_remove",
  "storage_note_content_load",
  "storage_note_content_save",
  "storage_note_content_remove",
  "storage_media_save",
  "storage_media_remove",
  "storage_media_base",
  "storage_meta_get",
  "storage_meta_set",
  "whisper_model_status",
  "whisper_download_model",
  "whisper_transcribe",
  "whisper_transcribe_media",
  "models_status",
  "models_download",
  "models_auto",
  "models_delete",
  "models_license",
  "voice_info",
  "voice_warm",
  "voice_synthesize",
  "window_frame",
  "widgets_publish",
  "widgets_desktop",
  "widgets_open",
]
