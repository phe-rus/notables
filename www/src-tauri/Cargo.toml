[package]
name = "notables"
version = "0.1.0"
description = "Notables — notes, journals, stories and books on every platform."
authors = ["Pherus"]
license = "MIT"
repository = "https://github.com/phe-rus/notables"
edition = "2024"
rust-version = "1.90"

[lib]
# Mobile targets load the app as a library; desktop links it from main.rs.
name = "notables_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-log = "2"
# On-device transcription (whisper.cpp) and model download.
whisper-rs = "0.16.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
tokio = { version = "1", features = ["fs", "io-util", "sync"] }
thiserror = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
