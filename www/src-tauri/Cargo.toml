[package]
name = "notables"
version = "0.1.0"
description = "Notables — notes, journals, stories and books on every platform."
authors = ["Pherus"]
license = "MIT"
repository = "https://github.com/phe-rus/notables"
edition = "2024"
rust-version = "1.90"

[lib]
# Mobile targets load the app as a library; desktop links it from main.rs.
name = "notables_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-log = "2"
# On-device transcription (whisper.cpp) and model download.
whisper-rs = "0.16.0"
# Decodes audiobook files natively, so hours of audio never sit in WebView memory.
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "isomp4", "ogg", "vorbis", "flac", "wav", "pcm", "alac"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
tokio = { version = "1", features = ["fs", "io-util", "sync", "time"] }
thiserror = "2"
# Model packs (spec 0001): checksums, free space, and the natural voice.
sha2 = "0.10"
fs4 = { version = "0.13", features = ["sync"] }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "download-binaries", "copy-dylibs", "tls-rustls", "api-27"] }
rand = "0.9"
unicode-normalization = "0.1"
# On-device storage: documents and metadata in SQLite, media as files.
rusqlite = { version = "0.40.2", features = ["bundled"] }
# Native save dialogs for exported files.
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-notification = "2"
chacha20poly1305 = "=0.10.1"
argon2 = "=0.5.3"
zeroize = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4", "serde"] }
tauri-plugin-os = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Linux: WebKitGTK refuses the microphone unless the app approves the request.
[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
keyring = { version = "=3.6.3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = "2.0.2"

[target.'cfg(target_os = "android")'.dependencies]
libc = "=0.2.189"
jni = "=0.21.1"
ndk-context = "=0.1.1"
tauri-plugin-nfc = { version = "2.4.1", path = "vendor/tauri-plugin-nfc" }
