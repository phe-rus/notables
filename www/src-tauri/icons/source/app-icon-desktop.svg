<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Notables">
  <title>Notables</title>
  <!-- app-icon.svg framed for desktop, the web and the in-app mark: the
       same art in a rounded square with room for its shadow. -->
  <defs>
    <linearGradient id="sheet" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" stop-color="#FFFEFB"/><stop offset="1" stop-color="#F2EADC"/></linearGradient>
    <filter id="fold" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="-10" dy="14" stdDeviation="14" flood-color="#5A4020" flood-opacity="0.18"/></filter>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#4A3418" flood-opacity="0.22"/></filter>
    <clipPath id="frame"><rect width="1024" height="1024" rx="230"/></clipPath>
  </defs>
  <g transform="translate(100 92) scale(0.8047)">
    <rect width="1024" height="1024" rx="230" fill="#E3D6C2" filter="url(#drop)"/>
    <g clip-path="url(#frame)">
      <path d="M0 0H700L1024 324V1024H0Z" fill="url(#sheet)"/>
      <path d="M700 0L1024 324H760Q700 324 700 264Z" fill="#F6EEE2" filter="url(#fold)"/>
      <path d="M300 760V420c0-12 15-17 22-7l232 330c7 10 22 5 22-7V520" fill="none" stroke="#2A2520" stroke-width="80" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="682" cy="760" r="41" fill="#EE8A2A"/>
    </g>
  </g>
</svg>
