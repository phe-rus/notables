name: Release

# One vX.Y.Z tag builds all platforms. Desktop installers share one draft
# GitHub release; mobile packages go to their existing testing channels.
# Manual runs require an explicit version and can select a platform group.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      platforms:
        description: Platforms to build
        type: choice
        options: [all, mobile, desktop, android, ios]
        default: all
      version:
        description: Release version, for example 0.2.13
        type: string
        required: true
      track:
        description: Google Play track
        type: choice
        options: [internal, alpha, beta, production]
        default: internal

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BUN_VERSION: 1.3.11
  NDK_VERSION: 30.0.16248370

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    outputs:
      name: ${{ steps.version.outputs.name }}
      code: ${{ steps.version.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        # The tag gives the version people see; the run number gives every
        # upload a higher build number, as both stores require.
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then name="${GITHUB_REF_NAME#v}"
          else name="$REQUESTED_VERSION"; fi
          [[ "$name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Expected an X.Y.Z version" >&2; exit 1; }
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            existing="$(git ls-remote --tags origin "refs/tags/v$name" "refs/tags/v$name^{}" | tail -1 | cut -f1)"
            if [[ -n "$existing" && "$existing" != "$GITHUB_SHA" ]]; then
              echo "This version already identifies another commit. Use a new release version." >&2
              exit 1
            fi
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$((10000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_OUTPUT"

  android:
    name: Android (Google Play)
    needs: version
    if: >-
      github.event_name == 'push' ||
      contains(fromJSON('["all","mobile","android"]'), inputs.platforms)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      # The runner ships the Android SDK; add the platform and NDK we build with.
      - name: Install the Android platform and NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" "ndk;${NDK_VERSION}"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: www/src-tauri -> target
          key: android-release
      - run: bun install --frozen-lockfile
      # ort has no prebuilt ONNX Runtime for x86_64 Android (ChromeOS, tablets),
      # so both ABIs link Microsoft's checksum-pinned build.
      - name: ONNX Runtime for both ABIs
        run: bun scripts/android/onnxruntime.ts arm64-v8a x86_64
      - name: Restore the upload key
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build the signed app bundle
        working-directory: www
        env:
          VITE_BUILD_NUMBER: ${{ needs.version.outputs.code }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: notables
        # Phones (arm64) and ChromeOS or tablets (x86_64), which crash under ARM translation.
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION" ANDROID_NDK="$ANDROID_HOME/ndk/$NDK_VERSION"
          export BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android="--sysroot=$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          export BINDGEN_EXTRA_CLANG_ARGS_x86_64_linux_android="--sysroot=$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          bun run tauri android build --aab --target aarch64 x86_64 --config \
            '{"version":"${{ needs.version.outputs.name }}","bundle":{"android":{"versionCode":${{ needs.version.outputs.code }}}}}'
      - name: Verify ML Kit release registrations
        run: bun scripts/android/verify-card-reader.ts www/src-tauri/gen/android/app/build/outputs/bundle/universalRelease/app-universal-release.aab "$ANDROID_HOME"
      - name: Send to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: notables.pherus.org
          releaseFiles: www/src-tauri/gen/android/app/build/outputs/bundle/universalRelease/*.aab
          tracks: ${{ inputs.track || 'internal' }}
          releaseName: ${{ needs.version.outputs.name }} (${{ needs.version.outputs.code }})
          status: completed
      - uses: actions/upload-artifact@v7
        with:
          name: android-${{ needs.version.outputs.name }}
          path: www/src-tauri/gen/android/app/build/outputs/bundle/universalRelease/*.aab

  ios:
    name: iOS (TestFlight)
    needs: version
    # Off until the App Store Connect API key is in the repository secrets;
    # then set the repository variable IOS_RELEASE to true.
    if: >-
      vars.IOS_RELEASE == 'true' && (
      github.event_name == 'push' ||
      contains(fromJSON('["all","mobile","ios"]'), inputs.platforms))
    runs-on: macos-latest
    env:
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_DEVELOPMENT_TEAM: LP7BW596WY
      # Native code (whisper.cpp) must target the app's minimum iOS, not the SDK's.
      IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: www/src-tauri -> target
          key: ios-release
      - run: bun install --frozen-lockfile
      - name: Restore the App Store Connect key
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          key=~/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY}.p8
          echo "${{ secrets.APPLE_API_KEY_P8 }}" > "$key"
          echo "APPLE_API_KEY_PATH=$key" >> "$GITHUB_ENV"
      - name: Generate the Xcode project
        working-directory: www
        # The project is generated here, so its Info.plist takes the version
        # from tauri.conf.json, not from the build's --config: stamp both, or
        # every TestFlight build stays at the first version. A fresh project
        # also carries Tauri's placeholder icon; put ours in.
        run: |
          jq '.version = "${{ needs.version.outputs.name }}"' src-tauri/tauri.conf.json > "$RUNNER_TEMP/tauri.conf.json"
          mv "$RUNNER_TEMP/tauri.conf.json" src-tauri/tauri.conf.json
          test -d src-tauri/gen/apple || bun run tauri ios init --ci
          for plist in src-tauri/gen/apple/*_iOS/Info.plist; do
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ needs.version.outputs.name }}" "$plist"
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ needs.version.outputs.code }}" "$plist"
          done
          cp src-tauri/icons/ios/*.png src-tauri/gen/apple/Assets.xcassets/AppIcon.appiconset/
      - name: Validate the card reader Swift package
        run: swift package --package-path www/src-tauri/plugins/tauri-plugin-card-reader/ios dump-package > /dev/null
      - name: Build the signed app
        working-directory: www
        env:
          VITE_BUILD_NUMBER: ${{ needs.version.outputs.code }}
        # Signing is automatic: Xcode fetches certificates and profiles with the API key.
        run: |
          bun run tauri ios build --export-method app-store-connect --config \
            '{"version":"${{ needs.version.outputs.name }}","bundle":{"iOS":{"bundleVersion":"${{ needs.version.outputs.code }}"}}}'
      - name: Send to TestFlight
        run: |
          xcrun altool --upload-app --type ios \
            --file "$(find www/src-tauri/gen/apple/build -name '*.ipa' | head -1)" \
            --apiKey "$APPLE_API_KEY" --apiIssuer "$APPLE_API_ISSUER"

  desktop:
    name: Desktop (${{ matrix.name }})
    needs: version
    if: github.event_name == 'push' || inputs.platforms == 'all' || inputs.platforms == 'desktop'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - name: windows-x64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - name: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
            bundles: dmg
          - name: macos-x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: www/src-tauri -> target
          key: desktop-${{ matrix.name }}
      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - name: Configure Windows libclang
        if: runner.os == 'Windows'
        run: echo "LIBCLANG_PATH=C:/Program Files/LLVM/bin" >> "$GITHUB_ENV"
      - name: Configure macOS ad hoc signing
        if: runner.os == 'macOS'
        run: echo 'APPLE_SIGNING_IDENTITY=-' >> "$GITHUB_ENV"
      - run: bun install --frozen-lockfile
      - name: Build installers
        working-directory: www
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.name }}
          VITE_BUILD_NUMBER: ${{ needs.version.outputs.code }}
          DESKTOP_TARGET: ${{ matrix.target }}
          DESKTOP_BUNDLES: ${{ matrix.bundles }}
        run: |
          bun run tauri build --target "$DESKTOP_TARGET" --bundles "$DESKTOP_BUNDLES" --config "{\"version\":\"$RELEASE_VERSION\"}"
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ needs.version.outputs.name }}-${{ matrix.name }}
          if-no-files-found: error
          path: |
            www/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            www/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            www/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            www/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            www/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

  desktop-release:
    name: Collect desktop installers
    needs: [version, desktop]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Collect assets in one draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.version.outputs.name }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          gh run download "$RUN_ID" --pattern "desktop-$RELEASE_VERSION-*" --dir installers
          mkdir release-assets
          while IFS= read -r -d '' file; do
            artifact="${file#installers/}"
            artifact="${artifact%%/*}"
            cp "$file" "release-assets/$artifact-$(basename "$file")"
          done < <(find installers -type f -print0)
          (cd release-assets && sha256sum * > SHA256SUMS)
          cat > "$RUNNER_TEMP/desktop-release.md" <<'NOTES'
          Desktop build preview for Linux, Windows and macOS.

          These installers have not received desktop functional acceptance testing.
          macOS uses ad hoc signing and is not notarised. Windows is not code signed.
          Keep this release in draft until platform testing and signing are complete.
          Android and iOS use the same release version through their testing stores.
          NOTES
          if ! gh release view "v$RELEASE_VERSION" > /dev/null 2>&1; then
            gh release create "v$RELEASE_VERSION" --target "$RELEASE_COMMIT" \
              --title "Notables v$RELEASE_VERSION" --draft --prerelease \
              --notes-file "$RUNNER_TEMP/desktop-release.md"
          fi
          gh release upload "v$RELEASE_VERSION" release-assets/* --clobber
