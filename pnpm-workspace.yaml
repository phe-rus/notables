packages:
  - apps/*
  - packages/*
  - workers/*

# Keep React on the version pinned by the current Expo SDK so web, mobile
# and shared packages always resolve a single copy.
catalog:
  react: 19.2.3
  react-dom: 19.2.3
  "@types/react": ~19.2.0
  "@types/react-dom": ~19.2.0
  typescript: 6.0.3
  vitest: 5.0.2
  yjs: 13.6.33
  zod: 4.6.5
